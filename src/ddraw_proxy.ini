; Daytona USA ddraw.dll proxy settings. 1 = on, 0 = off.
[Proxy]
; Layout version of this file. A settings file from an older build is brought up to date on start (your
; settings kept); the old file is kept as ddraw_proxy.ini.before-<version>. Do not change.
SettingsVersion=@VER@
; Our own DirectDraw: no exclusive mode or display-mode change; the game is shown borderless on the whole
; monitor, scaled to fit. 0 = use Windows' DirectDraw as before (with ForceEmulation below)
OwnDirectDraw=1
; Skip the "Please insert DAYTONA USA CD." check and load MUSIC.BIN from the game folder
SkipCDCheck=1
; Only with OwnDirectDraw=0: DirectDraw software emulation, same as Windows 98 "Hardware acceleration: None"
ForceEmulation=1
; Hide the "[Daytona USA] Loading..." box in full screen
HideLoadingDialog=1
; Write logs\ddraw_proxy_<date>_<time>.log in the game folder (one file per run)
Log=1
; Emulate the CD audio device: race music plays from Music\TrackNN.flac (lossless rips of the disc tracks)
CDAudioEmulation=1
; Music volume for the emulated CD audio, 0-100 (percent)
MusicVolume=100
; Save the settings the game forgets on exit: Motion, BG Disp, SeeThrough, keyboard keys,
; joystick button and axis assignment (written to DAYTONA.INI, restored on start)
PersistSettings=1
; Clear a read-only attribute on DAYTONA.INI / DAYTONA.DAT (files copied from CD), which blocks saving
FixReadOnlySaves=1
; The game's Options screen in pages: GAMEPLAY, SOUND, DISPLAY (screen, scaling, picture, vsync, and the game's
; Clip Size, Motion, BG Disp, SeeThrough), CONTROLS (layout, trigger point, dead zone, keyboard with a pad, the
; game's Key Configuration). Changes there are saved here at once. 1 = the game's original Options screen
OriginalOptionsMenu=0

[Display]
; Only with OwnDirectDraw=1. Alt+Enter switches between full screen and a window while playing.
; Fullscreen = borderless, covering the whole monitor (no display-mode change); Windowed = a normal window
Mode=Fullscreen
; Window size: 640x480 times this, reduced if it does not fit on the screen
WindowScale=2
; SharpBilinear = crisp pixels of even size with smooth edges between them; Nearest = hard pixels (uneven sizes
; at non-whole scales); Integer = hard pixels at the largest whole multiple that fits (may leave a border)
Scaling=SharpBilinear
; 16:10 = the game's 640x400 picture at its own shape, square pixels, as large as the screen allows (default)
; 4:3 = the 640x400 picture stretched to fill 4:3 (as a 4:3 CRT showed a 640x400 mode)
; Frame = the game's whole 640x480 frame at 4:3, with its own black bars above and below the picture
Picture=16:10
; Display to use: 0 = the one the game starts on, 1 = first display, 2 = second ...
Monitor=0
; 1 = the game pauses when you switch to another program (as the original); 0 = it keeps running
PauseInBackground=1
; 1 = wait for the screen's refresh when the game flips (as full-screen DirectDraw did)
VSync=1
; D3D11 (default) or GDI (slower, no ReShade; used automatically if Direct3D 11 is not available)
Renderer=D3D11
; How far ahead the track is drawn (CLIP SIZE on the Options DISPLAY page): Game = the game's own Clip Size
; (NORMAL, WIDE or VAST, as the original); Far = about twice VAST; Max = as far as the game's 1,800-polygon limit
; allows (the farthest scenery is left out when the limit is reached; cars still disappear at the game's own distance)
DrawDistance=Game

[Gameplay]
; Speed on the race display: MPH or KMH (the game's own km/h display). Also on the Options GAMEPLAY page.
Speed=MPH

[Cheats]
; The CHEATS page (Options > CHEATS): the game's own cheats, switched On / Off. Unlock=No: the bonus cars and horses
; are available once earned in PC MODE (top three on a course; win all three courses; win ENDURANCE driving the
; HORSE); Unlock=Yes: all at once. The others have no earning rule in the game and are always available.
Unlock=No
BonusCars=On
Horse=On
Horse2=On
Mirror=Off
TimeLap=Off
Karaoke=Off
Maniac=Off
Billboard=Off
Statue=Off
Afro=Off

[Controller]
; Gamepads (Xbox, PlayStation, Switch and most others) through SDL3, shown to the game as its own joystick.
; Wheels, pedals, arcade sticks and other joysticks work too (see [Joystick ...] below).
; All connected controllers drive the car together. Without one the keyboard works as before.
Enable=1
; The buttons are set on the game's Options screen, CONTROLS, BUTTONS (one key and one controller input for
; each function; kept in [Controls] below). LAYOUT there, or this setting, picks the starting table:
; Modern  = left stick steers, right trigger accelerates, left trigger brakes, Y / X shift up / down, RB changes
;           the view, Start = Start
; Classic = as the PlayStation version: cross accelerates, square brakes, triangle / circle shift up / down,
;           left stick steers, RB changes the view, Start = Start
; Keyboard (both): arrows steer, X accelerates, Z brakes, Up / Down shift, V changes the view, 1 to 4 gears,
;           F5 to F8 views, Enter = Start
; Off     = no bindings: the game's own button assignment (DAYTONA.INI) as in the original
; The game's accelerator and brake are on/off (as on the original pad): triggers and pedals press them.
Layout=Modern
; Percent of stick travel ignored around the centre
DeadZone=8
; Percent of trigger or pedal travel at which it presses (accelerates, brakes)
TriggerThreshold=30
; 1 = the game's own keys drive while a controller is connected: whichever was used last has the car
KeyboardWithPad=1

;[Controls]
; Written by the BUTTONS page: <Function>Key and <Function>Pad for SteerLeft SteerRight Accelerate Brake ShiftUp
; ShiftDown ViewChange Gear1 to Gear4 View1 to View4 Start. Keys by name (LEFT, X, F5, ENTER, NUM 0 ...), pad
; inputs: South East West North (A B X Y on an Xbox pad) Back Start LeftStick RightStick LeftShoulder
; RightShoulder LeftTrigger RightTrigger DpadUp DpadDown DpadLeft DpadRight LeftStickLeft LeftStickRight
; LeftStickUp LeftStickDown and the same for RightStick, or None.

; ---- Per-controller settings (optional) ----
; The log names each controller when it connects, with the section name to use, for example
; "settings section [Joystick Logitech G29]". Values are the game's (Saturn) buttons: A B C X Y Z L R Start None.
; A wheel's buttons in races: C accelerates, B and Z brake, X / Y shift down / up, R changes the view.
;
; A gamepad, in menus (and in races with Layout=Off), for that pad only. Keys: South East West North (A B X Y on an Xbox pad),
; LeftShoulder RightShoulder LeftTrigger RightTrigger Back Start Guide LeftStick RightStick
; DpadUp DpadDown DpadLeft DpadRight. Example:
;   [Pad Xbox Series X Controller]
;   RightShoulder=C
;   LeftShoulder=B
;
; A wheel or other joystick. Steering = axis number (0 = first axis). Accelerator and Brake = axis numbers of
; the pedals; leave both out to find them automatically (pedals rest at one end of their travel; the first two
; such axes are the accelerator and the brake), -1 = none. DeadZone = percent of steering ignored (default 2).
; ButtonN = the game's button for the device's button N (counting from 0); by default button N is the game's
; own button N+1 (A B C X Y Z R L Start), as the game reads a joystick through Windows. Example (the numbers
; are only an illustration; the log lists each axis's resting value to help find yours):
;   [Joystick Logitech G29 Driving Force Racing Wheel]
;   Steering=0
;   Accelerator=2
;   Brake=3
;   Button4=Y
;   Button5=X

;@@debug-begin (these lines are only in the debug build)
; ---- Test options (for development; leave as they are) ----
[Test]
; DrawDistance Far and Max: radius in cells of 32 units (0 = the built-in values)
FarRadius=0
MaxRadius=0
; Race game-logic rate: 20 (original), 30 or 60. Changes how often the game's logic runs during races.
RaceLogicRate=20
; 1 = log the player car's speed, position and the TIME countdown 4 times a second during races
RateLog=0
; Crash on purpose after this many seconds (0 = off), to test crash reports
CrashTest=0
; 1 = logging pass: count every Windows, DirectDraw, joystick and keyboard call per game screen (large log)
TraceCalls=0
; Log a checksum of the first N frames shown (0 = off), for comparing builds
FrameHash=0
; Save every Nth frame shown as a BMP in logs\frames (0 = off), at most FrameDumpMax files
FrameDumpEvery=0
FrameDumpMax=100
; Drive a virtual gamepad from a script file (lines: time_ms control value), for testing without a pad
VirtualPad=
; 1 = log the track drawing once a second (polygons in the 1,800 list, cells drawn)
DrawDistanceLog=0
;@@debug-end
